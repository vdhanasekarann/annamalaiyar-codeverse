<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1228" />
    <title>Offline | CodeVerse</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #1a2551, #050816 60%);
        color: #f4f7ff;
      }

      main {
        max-width: 480px;
        padding: 24px;
        border-radius: 16px;
        background: rgba(11, 18, 40, 0.75);
        border: 1px solid rgba(255, 255, 255, 0.15);
        text-align: center;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 1.375rem;
      }

      p {
        margin: 0 0 20px;
        line-height: 1.5;
        color: #dbe5ff;
      }

      a {
        display: inline-block;
        padding: 10px 16px;
        border-radius: 999px;
        color: #050816;
        background: #b8d4ff;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>CodeVerse is running with cached content. Reconnect to load fresh dashboard data.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
