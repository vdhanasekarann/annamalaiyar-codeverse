<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Free Fire AI – Premium Checkout</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #1f2937, #020617);
      color: #f9fafb;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .card {
      background: rgba(15,23,42,0.95);
      border-radius: 16px;
      padding: 24px 28px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.5);
      max-width: 420px;
      width: 90%;
    }
    h1 {
      font-size: 1.6rem;
      margin-bottom: 8px;
    }
    p.subtitle {
      font-size: 0.9rem;
      opacity: 0.8;
      margin-bottom: 16px;
    }
    ul {
      text-align: left;
      font-size: 0.9rem;
      line-height: 1.5;
      padding-left: 18px;
      margin-bottom: 18px;
    }
    #payBtn {
      background: linear-gradient(90deg, #f97316, #fb7185);
      border: none;
      color: white;
      padding: 12px 24px;
      font-size: 1rem;
      border-radius: 999px;
      cursor: pointer;
      width: 100%;
      margin-top: 8px;
    }
    #payBtn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .note {
      font-size: 0.8rem;
      opacity: 0.7;
      margin-top: 10px;
    }
    .error {
      color: #f97373;
      margin-top: 10px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Free Fire AI – Premium</h1>
    <p class="subtitle">Secure Razorpay Checkout</p>

    <ul>
      <li>Unlimited Anime / Chibi image generations</li>
      <li>4K wallpapers & HD guild banners</li>
      <li>Rank push coaching & Clash Squad meta</li>
      <li>Stylish name generator & more</li>
    </ul>

    <button id="payBtn">Pay ₹199 and Activate Premium</button>
    <div class="note">
      After payment, return to the GPT and type: <b>I have paid</b>.
    </div>
    <div class="error" id="errorBox" style="display:none;"></div>
  </div>

  <script>
    function getQueryParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    const orderId = getQueryParam("order_id");
    const payBtn = document.getElementById("payBtn");
    const errorBox = document.getElementById("errorBox");

    if (!orderId) {
      payBtn.disabled = true;
      errorBox.style.display = "block";
      errorBox.textContent = "Missing order ID. Please start the upgrade again from the GPT.";
    }

    payBtn.onclick = function () {
      if (!orderId) return;

      const options = {
        key: "rzp_live_R7raBEXD88psJO",  // <-- replace with your real Razorpay Key ID (public)
        amount: 19900,                // 199 * 100 – must match backend
        currency: "INR",
        name: "Free Fire AI Premium",
        description: "1 Month Premium Access",
        order_id: orderId,
        handler: function (response) {
          alert(
            "Payment successful!\\nPayment ID: " +
              response.razorpay_payment_id +
              "\\n\\nNow go back to the Free Fire AI GPT and type: 'I have paid'."
          );
        },
        theme: {
          color: "#6366f1"
        }
      };

      const rzp = new Razorpay(options);
      rzp.open();
    };
  </script>
</body>
</html>
